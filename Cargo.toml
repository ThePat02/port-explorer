[package]
name = "port-explorer"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_yaml = "0.9.34"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
chrono = "0.4"
once_cell = "1.19"
indicatif = "0.17"
threadpool = "1.8"
tempfile = "3.22.0"
warp = "0.3"
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0"
futures-util = "0.3"
tokio-stream = "0.1"
